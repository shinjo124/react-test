<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pieceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="5" y="5" width="90" height="90" rx="22" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Modern Chess Knight Silhouette -->
  <g transform="translate(18, 16) scale(1.4)" filter="url(#glow)">
    <!-- Base Plate -->
    <path
      d="M10 39 L36 39 C36 39 37 37 35 36 L11 36 C9 37 10 39 10 39 Z"
      fill="url(#pieceGrad)"
      stroke="#1e1b4b"
      stroke-width="1.2"
    />
    <path
      d="M12 36 L34 36 C34 33.5 32 31.5 29 31 L17 31 C14 31.5 12 33.5 12 36 Z"
      fill="url(#pieceGrad)"
      stroke="#1e1b4b"
      stroke-width="1.2"
    />

    <!-- Knight Head & Mane -->
    <path
      d="M22 8 C33 9 39 16 38 31 L15 31 C15 24 13 22 10 19 C11 15 14 11.5 17 10.5 C17 8.5 19 8 22 8 Z"
      fill="url(#pieceGrad)"
      stroke="#1e1b4b"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Eye -->
    <circle cx="21" cy="15" r="1.8" fill="#1e1b4b" />

    <!-- Nostril / Muzzle line -->
    <path
      d="M11 23 C15 21.5 19 22.5 23 26"
      fill="none"
      stroke="#1e1b4b"
      stroke-width="1.2"
      stroke-linecap="round"
    />

    <!-- Mane Grooves -->
    <path
      d="M27 10 C29 13 32 15 34 21"
      fill="none"
      stroke="rgba(30, 27, 75, 0.4)"
      stroke-width="1.2"
      stroke-linecap="round"
    />
  </g>
</svg>
